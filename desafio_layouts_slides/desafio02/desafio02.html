<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style02.css">
    <title>Slide 02</title>
</head>
<body>
    <div class="carousel">
        <!-- Seta esquerda -->
        <button class="arrow left">‹</button>

        <!-- Área do slide -->
        <div class="slide-area">
            <img src="imagens/Captura de tela 2026-08-18 150750.png" alt="">
        </div>

        <!-- Seta direita -->
        <button class="arrow right">›</button>

        <!-- Indicadores de paginação -->
        <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>
    </div>
    <div id="cards">
        <div id="card1">
            <img src="imagens/card01.png" alt="">

        </div>
        <div id="card2">
            <img src="imagens/card02.png" alt="">

        </div>
        <div id="card3">
            <img src="imagens/card03.png" alt="">

        </div>
        <div id="card4">
            <img src="imagens/card04.png" alt="">

        </div>
    </div>
</body>
</html>
