<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Perfil</title>
</head>
<body>
    <h1>Alexandre Peregrino</h1>
    <img src="imagens/aviao.jpg" style="max-width: 600px;" alt="aviao">
    <p>Sou Alexandre e gosto de programação</p>
    <a href="https://www.churchofjesuschrist.org/?lang=por">LDS</a>
    <form action="">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome">
        <label for="sobrenome">Sobrenome</label>
        <input type="text" id="sobrenome" name="sobrenome">
        <button type="submit">Enviar</button>
    </form>
    <form action="">
        <label for="html">HTML</label>
        <input type="radio" id="html" name="linguagem" value="html">

        <label for="css">CSS</label>
        <input type="radio" id="css" name="linguagem" value="css">

        <label for="js">Java Script</label>
        <input type="radio" id="js" name="linguagem" value="js">

        <button type="submit">Enviar</button>
    </form>
    <form action="">
        <label for="notebook">Notebook</label>
        <input type="checkbox" id="notebook" name="aparelhos" value="notebook">

        <label for="smartphone">Smartphone</label>
        <input type="checkbox" id="smartphone" name="aparelhos" value="smartphone">

        <label for="tablet">Tablet</label>
        <input type="checkbox" id="tablet" name="aparelhos" value="tablet">

        <label for="computador">Computador</label>
        <input type="checkbox" id="computador" name="aparelhos" value="computador">
    </form>
    <form action="">
    <label for="cor">Escolha uma cor</label>
    <select id="cor" name="cor">
        <option value="vermelho">Vermelho</option>
        <option value="azul">Azul</option>
        <option value="verde">Verde</option>
        <option value="amarelo">Amarelo</option>
    </select>
</form>
</body>
</html>
